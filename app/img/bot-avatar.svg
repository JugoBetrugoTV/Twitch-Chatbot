<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="botGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#9147ff"/>
      <stop offset="100%" style="stop-color:#5c16c5"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00d4aa"/>
      <stop offset="100%" style="stop-color:#00b894"/>
    </linearGradient>
  </defs>
  <circle cx="50" cy="50" r="50" fill="url(#botGrad)"/>
  <!-- Robot face -->
  <rect x="25" y="30" width="50" height="40" rx="8" fill="rgba(255,255,255,0.95)"/>
  <!-- Eyes -->
  <circle cx="38" cy="45" r="6" fill="url(#botGrad)"/>
  <circle cx="62" cy="45" r="6" fill="url(#botGrad)"/>
  <!-- Eye shine -->
  <circle cx="40" cy="43" r="2" fill="white"/>
  <circle cx="64" cy="43" r="2" fill="white"/>
  <!-- Mouth -->
  <rect x="35" y="58" width="30" height="6" rx="3" fill="url(#accentGrad)"/>
  <!-- Antenna -->
  <line x1="50" y1="30" x2="50" y2="18" stroke="rgba(255,255,255,0.9)" stroke-width="3" stroke-linecap="round"/>
  <circle cx="50" cy="15" r="5" fill="url(#accentGrad)"/>
  <!-- Side elements -->
  <rect x="15" y="42" width="8" height="16" rx="4" fill="rgba(255,255,255,0.8)"/>
  <rect x="77" y="42" width="8" height="16" rx="4" fill="rgba(255,255,255,0.8)"/>
</svg>
