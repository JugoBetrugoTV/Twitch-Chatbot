<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Song Request Overlay</title>
  <script src="/socket.io/socket.io.js"></script>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: transparent;
      overflow: hidden;
    }

    .song-container {
      position: fixed;
      bottom: 20px;
      right: 20px;
      width: 350px;
    }

    .now-playing {
      background: linear-gradient(135deg, rgba(30, 30, 35, 0.95), rgba(20, 20, 25, 0.95));
      border-radius: 12px;
      padding: 15px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.4);
      border: 1px solid rgba(145, 71, 255, 0.3);
      transform: translateX(400px);
      opacity: 0;
      transition: all 0.5s ease;
    }

    .now-playing.visible {
      transform: translateX(0);
      opacity: 1;
    }

    .now-playing-header {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 10px;
      color: #9147ff;
      font-size: 0.8rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .now-playing-header::before {
      content: '';
      display: inline-block;
      width: 8px;
      height: 8px;
      background: #ff4444;
      border-radius: 50%;
      animation: pulse 1.5s infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.5; }
    }

    .song-title {
      color: white;
      font-size: 1rem;
      font-weight: 600;
      margin-bottom: 5px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .song-meta {
      color: rgba(255, 255, 255, 0.6);
      font-size: 0.85rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .requested-by {
      display: flex;
      align-items: center;
      gap: 5px;
    }

    .requested-by::before {
      content: '';
      display: inline-block;
      width: 16px;
      height: 16px;
      background: url('data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" fill="rgba(255,255,255,0.6)" viewBox="0 0 24 24"><path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg>') no-repeat center;
      background-size: contain;
    }

    .queue-count {
      background: rgba(145, 71, 255, 0.3);
      padding: 3px 8px;
      border-radius: 10px;
      font-size: 0.75rem;
    }

    .progress-bar {
      margin-top: 10px;
      height: 4px;
      background: rgba(255, 255, 255, 0.1);
      border-radius: 2px;
      overflow: hidden;
    }

    .progress-fill {
      height: 100%;
      background: linear-gradient(90deg, #9147ff, #ff6b9d);
      border-radius: 2px;
      width: 0%;
      transition: width 1s linear;
    }

    .visualizer {
      display: flex;
      gap: 3px;
      align-items: flex-end;
      height: 20px;
      margin-left: auto;
    }

    .visualizer-bar {
      width: 4px;
      background: linear-gradient(to top, #9147ff, #ff6b9d);
      border-radius: 2px;
      animation: visualize 0.5s infinite ease-in-out alternate;
    }

    .visualizer-bar:nth-child(1) { animation-delay: 0s; }
    .visualizer-bar:nth-child(2) { animation-delay: 0.1s; }
    .visualizer-bar:nth-child(3) { animation-delay: 0.2s; }
    .visualizer-bar:nth-child(4) { animation-delay: 0.3s; }
    .visualizer-bar:nth-child(5) { animation-delay: 0.4s; }

    @keyframes visualize {
      0% { height: 5px; }
      100% { height: 20px; }
    }

    .queue-preview {
      margin-top: 10px;
      padding-top: 10px;
      border-top: 1px solid rgba(255, 255, 255, 0.1);
    }

    .queue-item {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 5px 0;
      color: rgba(255, 255, 255, 0.5);
      font-size: 0.8rem;
    }

    .queue-number {
      color: #9147ff;
      font-weight: 600;
      min-width: 20px;
    }

    .queue-title {
      flex: 1;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
  </style>
</head>
<body>
  <div class="song-container">
    <div class="now-playing" id="nowPlaying">
      <div class="now-playing-header">
        Now Playing
        <div class="visualizer">
          <div class="visualizer-bar"></div>
          <div class="visualizer-bar"></div>
          <div class="visualizer-bar"></div>
          <div class="visualizer-bar"></div>
          <div class="visualizer-bar"></div>
        </div>
      </div>
      <div class="song-title" id="songTitle">-</div>
      <div class="song-meta">
        <span class="requested-by" id="requestedBy">-</span>
        <span class="queue-count" id="queueCount">0 in queue</span>
      </div>
      <div class="progress-bar">
        <div class="progress-fill" id="progressFill"></div>
      </div>
      <div class="queue-preview" id="queuePreview"></div>
    </div>
  </div>

  <script>
    const socket = io();
    const nowPlaying = document.getElementById('nowPlaying');
    const songTitle = document.getElementById('songTitle');
    const requestedBy = document.getElementById('requestedBy');
    const queueCount = document.getElementById('queueCount');
    const progressFill = document.getElementById('progressFill');
    const queuePreview = document.getElementById('queuePreview');

    let currentSong = null;
    let songStartTime = null;
    let progressInterval = null;

    socket.on('init', (data) => {
      updateDisplay(data.songs);
    });

    socket.on('songs:started', (song) => {
      currentSong = song;
      songStartTime = Date.now();
      updateDisplay({ current: song, queue: [] });
      startProgressBar(song.duration);
      fetchQueue();
    });

    socket.on('songs:added', () => {
      fetchQueue();
    });

    socket.on('songs:skipped', () => {
      stopProgressBar();
      fetchQueue();
    });

    socket.on('songs:removed', () => {
      fetchQueue();
    });

    socket.on('songs:queueCleared', () => {
      updateDisplay({ current: currentSong, queue: [] });
    });

    async function fetchQueue() {
      try {
        const res = await fetch('/api/songs/queue');
        const data = await res.json();
        updateDisplay(data);
      } catch (error) {
        console.error('Failed to fetch queue:', error);
      }
    }

    function updateDisplay(data) {
      const current = data.current;
      const queue = data.queue || [];

      if (current) {
        nowPlaying.classList.add('visible');
        songTitle.textContent = current.title;
        requestedBy.innerHTML = `<span>${current.requestedBy}</span>`;
        queueCount.textContent = `${queue.length} in queue`;

        // Show next songs
        if (queue.length > 0) {
          queuePreview.innerHTML = queue.slice(0, 3).map((song, i) => `
            <div class="queue-item">
              <span class="queue-number">${i + 1}</span>
              <span class="queue-title">${escapeHtml(song.title)}</span>
            </div>
          `).join('');
          queuePreview.style.display = 'block';
        } else {
          queuePreview.style.display = 'none';
        }
      } else {
        nowPlaying.classList.remove('visible');
        stopProgressBar();
      }
    }

    function startProgressBar(duration) {
      stopProgressBar();
      progressFill.style.width = '0%';

      progressInterval = setInterval(() => {
        if (!songStartTime || !duration) return;

        const elapsed = (Date.now() - songStartTime) / 1000;
        const progress = Math.min((elapsed / duration) * 100, 100);
        progressFill.style.width = `${progress}%`;

        if (progress >= 100) {
          stopProgressBar();
        }
      }, 1000);
    }

    function stopProgressBar() {
      if (progressInterval) {
        clearInterval(progressInterval);
        progressInterval = null;
      }
    }

    function escapeHtml(text) {
      const div = document.createElement('div');
      div.textContent = text;
      return div.innerHTML;
    }

    // Initial fetch
    fetchQueue();
  </script>
</body>
</html>
