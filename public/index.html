<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Twitch Bot Dashboard</title>
  <script src="/socket.io/socket.io.js"></script>
  <style>
    :root {
      --bg-primary: #0e0e10;
      --bg-secondary: #18181b;
      --bg-tertiary: #1f1f23;
      --text-primary: #efeff1;
      --text-secondary: #adadb8;
      --accent: #9147ff;
      --accent-hover: #772ce8;
      --success: #00c853;
      --warning: #ff9800;
      --danger: #f44336;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
      background-color: var(--bg-primary);
      color: var(--text-primary);
      min-height: 100vh;
    }

    .header {
      background-color: var(--bg-secondary);
      padding: 1rem 2rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid var(--bg-tertiary);
    }

    .header h1 {
      font-size: 1.5rem;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .status-badge {
      display: inline-block;
      padding: 0.25rem 0.75rem;
      border-radius: 1rem;
      font-size: 0.875rem;
      font-weight: 500;
    }

    .status-badge.connected {
      background-color: var(--success);
      color: white;
    }

    .status-badge.disconnected {
      background-color: var(--danger);
      color: white;
    }

    .container {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(400px, 1fr));
      gap: 1.5rem;
      padding: 1.5rem;
      max-width: 1800px;
      margin: 0 auto;
    }

    .card {
      background-color: var(--bg-secondary);
      border-radius: 0.5rem;
      overflow: hidden;
    }

    .card-header {
      background-color: var(--bg-tertiary);
      padding: 1rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .card-header h2 {
      font-size: 1rem;
      font-weight: 600;
    }

    .card-body {
      padding: 1rem;
      max-height: 400px;
      overflow-y: auto;
    }

    .stats-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 1rem;
    }

    .stat-item {
      background-color: var(--bg-tertiary);
      padding: 1rem;
      border-radius: 0.5rem;
      text-align: center;
    }

    .stat-value {
      font-size: 1.5rem;
      font-weight: 700;
      color: var(--accent);
    }

    .stat-label {
      font-size: 0.75rem;
      color: var(--text-secondary);
      margin-top: 0.25rem;
    }

    .message-list {
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
    }

    .message-item {
      padding: 0.5rem;
      background-color: var(--bg-tertiary);
      border-radius: 0.25rem;
      font-size: 0.875rem;
    }

    .message-user {
      font-weight: 600;
      margin-right: 0.5rem;
    }

    .message-text {
      color: var(--text-secondary);
    }

    .queue-list {
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
    }

    .queue-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0.75rem;
      background-color: var(--bg-tertiary);
      border-radius: 0.25rem;
    }

    .queue-item.current {
      border-left: 3px solid var(--accent);
    }

    .queue-item-info {
      flex: 1;
      min-width: 0;
    }

    .queue-item-title {
      font-weight: 500;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .queue-item-meta {
      font-size: 0.75rem;
      color: var(--text-secondary);
    }

    .btn {
      padding: 0.5rem 1rem;
      border: none;
      border-radius: 0.25rem;
      cursor: pointer;
      font-size: 0.875rem;
      font-weight: 500;
      transition: background-color 0.2s;
    }

    .btn-primary {
      background-color: var(--accent);
      color: white;
    }

    .btn-primary:hover {
      background-color: var(--accent-hover);
    }

    .btn-danger {
      background-color: var(--danger);
      color: white;
    }

    .btn-danger:hover {
      background-color: #d32f2f;
    }

    .btn-small {
      padding: 0.25rem 0.5rem;
      font-size: 0.75rem;
    }

    .btn-group {
      display: flex;
      gap: 0.5rem;
    }

    .viewer-list {
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem;
    }

    .viewer-badge {
      display: inline-block;
      padding: 0.25rem 0.5rem;
      background-color: var(--bg-tertiary);
      border-radius: 0.25rem;
      font-size: 0.75rem;
    }

    .tts-toggle {
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .toggle-switch {
      position: relative;
      width: 48px;
      height: 24px;
    }

    .toggle-switch input {
      opacity: 0;
      width: 0;
      height: 0;
    }

    .toggle-slider {
      position: absolute;
      cursor: pointer;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background-color: var(--bg-tertiary);
      transition: 0.3s;
      border-radius: 24px;
    }

    .toggle-slider:before {
      position: absolute;
      content: "";
      height: 18px;
      width: 18px;
      left: 3px;
      bottom: 3px;
      background-color: white;
      transition: 0.3s;
      border-radius: 50%;
    }

    input:checked + .toggle-slider {
      background-color: var(--accent);
    }

    input:checked + .toggle-slider:before {
      transform: translateX(24px);
    }

    .empty-state {
      text-align: center;
      padding: 2rem;
      color: var(--text-secondary);
    }

    .overlay-links {
      margin-top: 1rem;
      padding-top: 1rem;
      border-top: 1px solid var(--bg-tertiary);
    }

    .overlay-links a {
      color: var(--accent);
      text-decoration: none;
      display: block;
      margin-bottom: 0.5rem;
    }

    .overlay-links a:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <header class="header">
    <h1>Twitch Bot Dashboard</h1>
    <span id="connectionStatus" class="status-badge disconnected">Disconnected</span>
  </header>

  <main class="container">
    <!-- Stats Card -->
    <div class="card">
      <div class="card-header">
        <h2>Statistics</h2>
      </div>
      <div class="card-body">
        <div class="stats-grid">
          <div class="stat-item">
            <div class="stat-value" id="statMessages">0</div>
            <div class="stat-label">Messages</div>
          </div>
          <div class="stat-item">
            <div class="stat-value" id="statViewers">0</div>
            <div class="stat-label">Viewers</div>
          </div>
          <div class="stat-item">
            <div class="stat-value" id="statCommands">0</div>
            <div class="stat-label">Commands</div>
          </div>
          <div class="stat-item">
            <div class="stat-value" id="statSongs">0</div>
            <div class="stat-label">Songs Played</div>
          </div>
        </div>
        <div class="overlay-links">
          <strong>OBS Overlays:</strong>
          <a href="/overlay/tts" target="_blank">TTS Overlay</a>
          <a href="/overlay/songs" target="_blank">Song Request Overlay</a>
        </div>
      </div>
    </div>

    <!-- Chat Card -->
    <div class="card">
      <div class="card-header">
        <h2>Live Chat</h2>
      </div>
      <div class="card-body">
        <div id="chatMessages" class="message-list">
          <div class="empty-state">Waiting for messages...</div>
        </div>
      </div>
    </div>

    <!-- Song Queue Card -->
    <div class="card">
      <div class="card-header">
        <h2>Song Queue</h2>
        <div class="btn-group">
          <button class="btn btn-primary btn-small" onclick="skipSong()">Skip</button>
          <button class="btn btn-danger btn-small" onclick="clearSongQueue()">Clear</button>
        </div>
      </div>
      <div class="card-body">
        <div id="songQueue" class="queue-list">
          <div class="empty-state">No songs in queue</div>
        </div>
      </div>
    </div>

    <!-- TTS Card -->
    <div class="card">
      <div class="card-header">
        <h2>Text-to-Speech</h2>
        <div class="tts-toggle">
          <label class="toggle-switch">
            <input type="checkbox" id="ttsToggle" onchange="toggleTTS()">
            <span class="toggle-slider"></span>
          </label>
          <button class="btn btn-primary btn-small" onclick="skipTTS()">Skip</button>
        </div>
      </div>
      <div class="card-body">
        <div id="ttsQueue" class="queue-list">
          <div class="empty-state">No TTS messages in queue</div>
        </div>
      </div>
    </div>

    <!-- Viewers Card -->
    <div class="card">
      <div class="card-header">
        <h2>Online Viewers</h2>
      </div>
      <div class="card-body">
        <div id="viewerList" class="viewer-list">
          <div class="empty-state">No viewers online</div>
        </div>
      </div>
    </div>
  </main>

  <script>
    const socket = io();
    let chatMessages = [];
    const maxChatMessages = 50;

    socket.on('connect', () => {
      document.getElementById('connectionStatus').textContent = 'Connected';
      document.getElementById('connectionStatus').className = 'status-badge connected';
    });

    socket.on('disconnect', () => {
      document.getElementById('connectionStatus').textContent = 'Disconnected';
      document.getElementById('connectionStatus').className = 'status-badge disconnected';
    });

    socket.on('init', (data) => {
      updateStats(data.stats);
      updateViewers(data.viewers);
      updateSongQueue(data.songs);
      updateTTSQueue(data.tts);
      chatMessages = data.messages || [];
      renderChatMessages();
    });

    socket.on('chat:message', (message) => {
      chatMessages.push(message);
      if (chatMessages.length > maxChatMessages) {
        chatMessages.shift();
      }
      renderChatMessages();
      document.getElementById('statMessages').textContent =
        parseInt(document.getElementById('statMessages').textContent) + 1;
    });

    socket.on('viewers:updated', (data) => {
      updateViewers(data);
    });

    socket.on('songs:added', (song) => {
      refreshSongQueue();
    });

    socket.on('songs:started', (song) => {
      refreshSongQueue();
    });

    socket.on('songs:skipped', () => {
      refreshSongQueue();
    });

    socket.on('tts:queued', (message) => {
      refreshTTSQueue();
    });

    socket.on('tts:complete', () => {
      refreshTTSQueue();
    });

    socket.on('tts:enabledChanged', (enabled) => {
      document.getElementById('ttsToggle').checked = enabled;
    });

    function updateStats(stats) {
      document.getElementById('statMessages').textContent = stats.messagesReceived || 0;
      document.getElementById('statCommands').textContent = stats.commandsExecuted || 0;
      document.getElementById('statSongs').textContent = stats.songsPlayed || 0;
    }

    function updateViewers(data) {
      document.getElementById('statViewers').textContent = data.count || 0;
      const container = document.getElementById('viewerList');

      if (!data.online || data.online.length === 0) {
        container.innerHTML = '<div class="empty-state">No viewers online</div>';
        return;
      }

      container.innerHTML = data.online
        .map(v => `<span class="viewer-badge">${v}</span>`)
        .join('');
    }

    function updateSongQueue(data) {
      const container = document.getElementById('songQueue');
      const queue = data.queue || [];
      const current = data.current;

      if (!current && queue.length === 0) {
        container.innerHTML = '<div class="empty-state">No songs in queue</div>';
        return;
      }

      let html = '';

      if (current) {
        html += `
          <div class="queue-item current">
            <div class="queue-item-info">
              <div class="queue-item-title">Now Playing: ${escapeHtml(current.title)}</div>
              <div class="queue-item-meta">Requested by ${escapeHtml(current.requestedBy)}</div>
            </div>
          </div>
        `;
      }

      queue.forEach((song, index) => {
        html += `
          <div class="queue-item">
            <div class="queue-item-info">
              <div class="queue-item-title">${index + 1}. ${escapeHtml(song.title)}</div>
              <div class="queue-item-meta">Requested by ${escapeHtml(song.requestedBy)}</div>
            </div>
            <button class="btn btn-danger btn-small" onclick="removeSong(${index})">Remove</button>
          </div>
        `;
      });

      container.innerHTML = html;
    }

    function updateTTSQueue(data) {
      document.getElementById('ttsToggle').checked = data.enabled;
      const container = document.getElementById('ttsQueue');
      const queue = data.queue || [];

      if (queue.length === 0) {
        container.innerHTML = '<div class="empty-state">No TTS messages in queue</div>';
        return;
      }

      container.innerHTML = queue
        .map((msg, i) => `
          <div class="queue-item">
            <div class="queue-item-info">
              <div class="queue-item-title">${escapeHtml(msg.username)}</div>
              <div class="queue-item-meta">${escapeHtml(msg.text)}</div>
            </div>
          </div>
        `)
        .join('');
    }

    function renderChatMessages() {
      const container = document.getElementById('chatMessages');

      if (chatMessages.length === 0) {
        container.innerHTML = '<div class="empty-state">Waiting for messages...</div>';
        return;
      }

      container.innerHTML = chatMessages
        .slice(-30)
        .reverse()
        .map(msg => `
          <div class="message-item">
            <span class="message-user" style="color: ${msg.color || '#9147ff'}">${escapeHtml(msg.displayName)}</span>
            <span class="message-text">${escapeHtml(msg.message)}</span>
          </div>
        `)
        .join('');
    }

    async function refreshSongQueue() {
      const res = await fetch('/api/songs/queue');
      const data = await res.json();
      updateSongQueue(data);
    }

    async function refreshTTSQueue() {
      const res = await fetch('/api/tts/queue');
      const data = await res.json();
      updateTTSQueue(data);
    }

    function skipSong() {
      socket.emit('song:skip');
    }

    function removeSong(index) {
      socket.emit('song:remove', index);
    }

    function clearSongQueue() {
      if (confirm('Are you sure you want to clear the song queue?')) {
        fetch('/api/songs/queue', { method: 'DELETE' });
      }
    }

    function skipTTS() {
      socket.emit('tts:skip');
    }

    function toggleTTS() {
      socket.emit('tts:toggle');
    }

    function escapeHtml(text) {
      const div = document.createElement('div');
      div.textContent = text;
      return div.innerHTML;
    }
  </script>
</body>
</html>
