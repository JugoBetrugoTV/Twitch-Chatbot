<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <defs>
    <linearGradient id="mainGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#9147ff"/>
      <stop offset="50%" style="stop-color:#772ce8"/>
      <stop offset="100%" style="stop-color:#5c16c5"/>
    </linearGradient>
    <linearGradient id="accentGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00d4aa"/>
      <stop offset="100%" style="stop-color:#00b894"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="innerShadow">
      <feOffset dx="0" dy="2"/>
      <feGaussianBlur stdDeviation="2" result="offset-blur"/>
      <feComposite operator="out" in="SourceGraphic" in2="offset-blur" result="inverse"/>
      <feFlood flood-color="black" flood-opacity="0.3" result="color"/>
      <feComposite operator="in" in="color" in2="inverse" result="shadow"/>
      <feComposite operator="over" in="shadow" in2="SourceGraphic"/>
    </filter>
  </defs>

  <!-- Background Circle with Gradient -->
  <circle cx="100" cy="100" r="90" fill="url(#mainGradient)" filter="url(#glow)"/>

  <!-- Inner Circle Ring -->
  <circle cx="100" cy="100" r="80" fill="none" stroke="rgba(255,255,255,0.1)" stroke-width="2"/>

  <!-- Core Symbol - Stylized "S" with streaming waves -->
  <g filter="url(#innerShadow)">
    <!-- Main S Shape -->
    <path d="M70 60
             C70 50, 85 45, 100 45
             C130 45, 140 60, 140 75
             C140 90, 125 100, 100 100
             C75 100, 60 110, 60 125
             C60 140, 75 155, 100 155
             C115 155, 130 150, 130 140"
          fill="none"
          stroke="white"
          stroke-width="16"
          stroke-linecap="round"
          opacity="0.95"/>

    <!-- Streaming Waves -->
    <path d="M145 70 L160 55 M145 80 L165 65 M145 90 L160 80"
          fill="none"
          stroke="url(#accentGradient)"
          stroke-width="4"
          stroke-linecap="round"/>

    <!-- Dot accent -->
    <circle cx="135" cy="135" r="8" fill="url(#accentGradient)"/>
  </g>

  <!-- Decorative elements -->
  <circle cx="55" cy="55" r="4" fill="rgba(255,255,255,0.3)"/>
  <circle cx="145" cy="145" r="3" fill="rgba(255,255,255,0.2)"/>
</svg>
