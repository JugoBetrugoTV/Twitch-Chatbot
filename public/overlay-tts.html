<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TTS Overlay</title>
  <script src="/socket.io/socket.io.js"></script>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: transparent;
      overflow: hidden;
    }

    .tts-container {
      position: fixed;
      bottom: 20px;
      left: 20px;
      right: 20px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      pointer-events: none;
    }

    .tts-message {
      background: linear-gradient(135deg, rgba(145, 71, 255, 0.9), rgba(119, 44, 232, 0.9));
      color: white;
      padding: 15px 20px;
      border-radius: 12px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
      transform: translateY(100px);
      opacity: 0;
      animation: slideIn 0.5s ease forwards;
      max-width: 600px;
    }

    .tts-message.hiding {
      animation: slideOut 0.5s ease forwards;
    }

    @keyframes slideIn {
      to {
        transform: translateY(0);
        opacity: 1;
      }
    }

    @keyframes slideOut {
      to {
        transform: translateY(100px);
        opacity: 0;
      }
    }

    .tts-username {
      font-weight: bold;
      font-size: 1.1rem;
      margin-bottom: 5px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .tts-username::before {
      content: '';
      display: inline-block;
      width: 24px;
      height: 24px;
      background: url('data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" fill="white" viewBox="0 0 24 24"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/></svg>') no-repeat center;
      background-size: contain;
    }

    .tts-text {
      font-size: 1rem;
      line-height: 1.4;
      word-wrap: break-word;
    }

    .speaking-indicator {
      display: inline-flex;
      gap: 3px;
      margin-left: 10px;
    }

    .speaking-indicator span {
      width: 4px;
      height: 16px;
      background: white;
      border-radius: 2px;
      animation: wave 0.5s infinite ease-in-out;
    }

    .speaking-indicator span:nth-child(2) {
      animation-delay: 0.1s;
    }

    .speaking-indicator span:nth-child(3) {
      animation-delay: 0.2s;
    }

    @keyframes wave {
      0%, 100% { transform: scaleY(0.5); }
      50% { transform: scaleY(1); }
    }
  </style>
</head>
<body>
  <div class="tts-container" id="ttsContainer"></div>

  <script>
    const socket = io();
    const container = document.getElementById('ttsContainer');
    let audioContext = null;
    let currentAudio = null;

    // Initialize audio context on user interaction (required by browsers)
    document.addEventListener('click', () => {
      if (!audioContext) {
        audioContext = new (window.AudioContext || window.webkitAudioContext)();
      }
    });

    socket.on('tts:play', async (data) => {
      const { message, audioUrl } = data;

      // Show message
      const msgElement = document.createElement('div');
      msgElement.className = 'tts-message';
      msgElement.innerHTML = `
        <div class="tts-username">
          ${escapeHtml(message.username)}
          <div class="speaking-indicator">
            <span></span>
            <span></span>
            <span></span>
          </div>
        </div>
        <div class="tts-text">${escapeHtml(message.text)}</div>
      `;
      container.appendChild(msgElement);

      // Play audio
      try {
        const audio = new Audio(audioUrl);
        currentAudio = audio;

        audio.onended = () => {
          msgElement.classList.add('hiding');
          setTimeout(() => {
            msgElement.remove();
          }, 500);
          socket.emit('tts:playbackComplete');
        };

        audio.onerror = () => {
          msgElement.classList.add('hiding');
          setTimeout(() => {
            msgElement.remove();
          }, 500);
        };

        await audio.play();
      } catch (error) {
        console.error('Audio playback failed:', error);
        // Still show message for a few seconds
        setTimeout(() => {
          msgElement.classList.add('hiding');
          setTimeout(() => {
            msgElement.remove();
          }, 500);
        }, 3000);
      }
    });

    socket.on('tts:skipped', () => {
      if (currentAudio) {
        currentAudio.pause();
        currentAudio = null;
      }
      const messages = container.querySelectorAll('.tts-message');
      messages.forEach(msg => {
        msg.classList.add('hiding');
        setTimeout(() => msg.remove(), 500);
      });
    });

    function escapeHtml(text) {
      const div = document.createElement('div');
      div.textContent = text;
      return div.innerHTML;
    }
  </script>
</body>
</html>
